<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PelcoPT Widget</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="widget-body">
    <div class="widget-shell" id="widgetShell">
      <header class="widget-drag">
        <span class="dot" id="wLink"></span>
        <strong>PelcoPT</strong>
        <span id="wPose" class="w-pose">— / —</span>
        <button type="button" id="wCollapse" class="icon-btn" title="Collapse">–</button>
      </header>
      <div id="wBody">
        <div class="pad compact" id="wJog">
          <button data-jog="upleft">↖</button>
          <button data-jog="up">▲</button>
          <button data-jog="upright">↗</button>
          <button data-jog="left">◀</button>
          <button id="wStop" class="stop">STOP</button>
          <button data-jog="right">▶</button>
          <button data-jog="downleft">↙</button>
          <button data-jog="down">▼</button>
          <button data-jog="downright">↘</button>
        </div>
        <div class="preset-grid compact" id="wPresets"></div>
        <div class="widget-tools">
          <label>Opacity <input id="wOpacity" type="range" min="0.2" max="1" step="0.05" value="0.85" /></label>
          <label class="check"><input id="wPinned" type="checkbox" checked /> On top</label>
        </div>
      </div>
    </div>
    <script type="module" src="./widget.ts"></script>
  </body>
</html>
